<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR · Tzu-Hsin Hsieh</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
        const showInfo = () => {
            let y = 0;
            const profileButton = document.querySelector("#profile-button");
            const webButton = document.querySelector("#web-button");
            const emailButton = document.querySelector("#email-button");
            const locationButton = document.querySelector("#location-button");
            const githubButton = document.querySelector("#github-button");
            const text = document.querySelector("#text");
            const clickButton = document.querySelector("#click-button");

            profileButton.setAttribute("visible", true);
            setTimeout(() => { webButton.setAttribute("visible", true); }, 300);
            setTimeout(() => { emailButton.setAttribute("visible", true); }, 600);
            setTimeout(() => { locationButton.setAttribute("visible", true); }, 900);
            setTimeout(() => { githubButton.setAttribute("visible", true); }, 1200);

            let currentTab = '';
            webButton.addEventListener('click', function () {
                text.setAttribute("value", "celine-hsieh.github.io");
                clickButton.setAttribute("visible", true);
                currentTab = 'web';
            });
            emailButton.addEventListener('click', function () {
                text.setAttribute("value", "thhsieh@tudelft.nl");
                clickButton.setAttribute("visible", true);
                currentTab = 'email';
            });
            profileButton.addEventListener('click', function () {
                text.setAttribute("value", "@celinehsieh for more!");
                clickButton.setAttribute("visible", true);
                currentTab = 'profile';
            });
            locationButton.addEventListener('click', function () {
                text.setAttribute("value", "linkedin: @celinehsieh68");
                clickButton.setAttribute("visible", true);
                currentTab = 'linkedin';
            });
            githubButton.addEventListener('click', function () {
                text.setAttribute("value", "github: @celine-hsieh");
                clickButton.setAttribute("visible", true);
                currentTab = 'github';
            });
            text.addEventListener('click', function () {
                if (currentTab === 'web') {
                    window.location.href = "https://celine-hsieh.github.io";
                } else if (currentTab === 'linkedin') {
                    window.location.href = "https://linkedin.com/in/celinehsieh68";
                } else if (currentTab === 'github') {
                    window.location.href = "https://github.com/celine-hsieh";
                } else if (currentTab === 'profile') {
                    window.location.href = "https://celine-hsieh.github.io";
                }
            });
            text.object3D.lookAt(camera.object3D.position);
        }

        const showPortfolio = (done) => {
            const portfolio = document.querySelector("#portfolio-panel");
            const portfolioLeftButton = document.querySelector("#portfolio-left-button");
            const portfolioRightButton = document.querySelector("#portfolio-right-button");
            let y = 0;
            let currentItem = 0;
            portfolio.setAttribute("visible", true);
            const showPortfolioItem = (item) => {
                for (let i = 0; i <= 4; i++) {
                    document.querySelector("#portfolio-item" + i).setAttribute("visible", i === item);
                }
            }
            const id = setInterval(() => {
                y += 0.008;
                if (y >= 0.6) {
                    clearInterval(id);
                    portfolioLeftButton.setAttribute("visible", true);
                    portfolioRightButton.setAttribute("visible", true);
                    portfolioLeftButton.addEventListener('click', () => {
                        currentItem = (currentItem + 1) % 5;
                        showPortfolioItem(currentItem);
                    });
                    portfolioRightButton.addEventListener('click', () => {
                        currentItem = (currentItem - 1 + 5) % 5;
                        showPortfolioItem(currentItem);
                    });
                    setTimeout(() => { done(); }, 500);
                }
                portfolio.setAttribute("position", "0 " + y + " -0.01");
            }, 10);
        }

        const showAvatar = (onDone) => {
            const avatar = document.querySelector("#avatar");
            let z = -0.3;
            let scale = 0.01;
            const id = setInterval(() => {
                z += 0.008;
                if (scale <= 0.65) { scale += 0.01; }
                if (z >= 0.3) {
                    clearInterval(id);
                    onDone();
                }
                avatar.setAttribute("position", `0 -0.25 ${z}`);
                avatar.setAttribute("scale", `${scale} ${scale} ${scale}`);
            }, 10);
        };

        AFRAME.registerComponent('mytarget', {
            init: function () {
                this.el.addEventListener('targetFound', event => {
                    showAvatar(() => {
                        setTimeout(() => {
                            showPortfolio(() => {
                                setTimeout(() => { showInfo(); }, 300);
                            });
                        }, 300);
                    });
                });
                this.el.addEventListener('targetLost', event => {
                    console.log("target lost");
                });
            }
        });
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            width: 100%; height: 100vh;
            overflow: hidden;
        }
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            z-index: 100;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(0,212,255,0.4);
            color: #00D4FF; font-size: 0.82rem; font-weight: 600;
            border-radius: 2rem; text-decoration: none;
            background: rgba(0,212,255,0.08);
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(0,212,255,0.18); }
        .ar-label {
            color: #00D4FF; font-size: 0.78rem; font-family: monospace;
            letter-spacing: 0.15em; opacity: 0.8;
        }
        .example-container {
            overflow: hidden; position: absolute;
            width: 100%; height: 100%;
        }
        .clickable { pointer-events: auto; z-index: 1000; }
        #example-scanning-overlay {
            display: flex; align-items: center; justify-content: center;
            position: absolute; left: 0; right: 0; top: 0; bottom: 0;
            background: transparent; z-index: 2;
        }
        @media (min-aspect-ratio: 1/1) { #example-scanning-overlay .inner { width: 50vh; height: 50vh; } }
        @media (max-aspect-ratio: 1/1) { #example-scanning-overlay .inner { width: 80vw; height: 80vw; } }
        #example-scanning-overlay .inner {
            display: flex; align-items: center; justify-content: center;
            position: relative;
            background:
                linear-gradient(to right, #00D4FF 10px, transparent 10px) 0 0,
                linear-gradient(to right, #00D4FF 10px, transparent 10px) 0 100%,
                linear-gradient(to left, #00D4FF 10px, transparent 10px) 100% 0,
                linear-gradient(to left, #00D4FF 10px, transparent 10px) 100% 100%,
                linear-gradient(to bottom, #00D4FF 10px, transparent 10px) 0 0,
                linear-gradient(to bottom, #00D4FF 10px, transparent 10px) 100% 0,
                linear-gradient(to top, #00D4FF 10px, transparent 10px) 0 100%,
                linear-gradient(to top, #00D4FF 10px, transparent 10px) 100% 100%;
            background-repeat: no-repeat; background-size: 40px 40px;
        }
        #example-scanning-overlay.hidden { display: none; }
        #example-scanning-overlay img { opacity: 0.6; width: 90%; align-self: center; }
        #example-scanning-overlay .inner .scanline {
            position: absolute; width: 100%; height: 3px;
            background: #00D4FF;
            box-shadow: 0 0 8px #00D4FF;
            animation: move 2s linear infinite;
        }
        @keyframes move { 0%,100%{ top: 0% } 50%{ top: calc(100% - 3px) } }
        .ar-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px 14px;
            text-align: center;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
            color: rgba(255,255,255,0.5); font-size: 11px; z-index: 100;
            display: flex; flex-direction: column; gap: 5px;
        }
        .ar-footer-hint {
            color: rgba(255,255,255,0.35); font-size: 10.5px;
        }
        .ar-footer-hint a {
            color: #00D4FF; text-decoration: none;
            border-bottom: 1px solid rgba(0,212,255,0.4);
        }
        .ar-footer-hint a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-btn">← Back</a>
        <span class="ar-label">⬡ AR MODE</span>
    </div>

    <div class="example-container">
        <div id="example-scanning-overlay" class="hidden">
            <div class="inner">
                <img src="./examples/image-tracking/assets/card-example/card.png" />
                <div class="scanline"></div>
            </div>
        </div>

        <a-scene
            mindar-image="imageTargetSrc: ./examples/image-tracking/assets/card-example/card.mind; showStats: false; uiScanning: #example-scanning-overlay;"
            embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-assets>
                <img id="card" src="./examples/image-tracking/assets/card-example/card.png" />
                <img id="icon-web" src="./examples/image-tracking/assets/card-example/icons/web.png" />
                <img id="icon-linkedin" src="./examples/image-tracking/assets/card-example/icons/linkedin.png" />
                <img id="icon-profile" src="./examples/image-tracking/assets/card-example/icons/profile.png" />
                <img id="icon-github" src="./examples/image-tracking/assets/card-example/icons/github.png" />
                <img id="icon-email" src="./examples/image-tracking/assets/card-example/icons/email.png" />
                <img id="icon-play" src="./examples/image-tracking/assets/card-example/icons/play.png" />
                <img id="icon-left" src="./examples/image-tracking/assets/card-example/icons/left.png" />
                <img id="icon-right" src="./examples/image-tracking/assets/card-example/icons/right.png" />
                <img id="icon-click" src="./examples/image-tracking/assets/card-example/icons/click.png" />
                <img id="paintandquest-preview" src="./examples/image-tracking/assets/card-example/portfolio/01_UrbanSight.png" />
                <video id="paintandquest-video-webm" autoplay="false" loop="false"
                    src="./examples/image-tracking/assets/card-example/portfolio/UrbanSight.webm"></video>
                <img id="02_CityScope" src="./examples/image-tracking/assets/card-example/portfolio/02_CityScope.png" />
                <img id="03_SmartMonitoring" src="./examples/image-tracking/assets/card-example/portfolio/03_SmartMonitoring.png" />
                <img id="04_CrowdPrediction" src="./examples/image-tracking/assets/card-example/portfolio/04_CrowdPrediction.png" />
                <img id="05_NonEuclidianGeometry" src="./examples/image-tracking/assets/card-example/portfolio/05_NonEuclidianGeometry.png" />
                <a-asset-item id="avatarModel" src="./examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
            </a-assets>

            <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false"
                cursor="fuse: false; rayOrigin: mouse;" fov="80" near="0.1"
                raycaster="far: 100000; objects: .clickable">
            </a-camera>

            <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
                <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
                <a-entity visible=false id="portfolio-panel" position="0 0 -0.01">
                    <a-text value="Portfolio" color="black" align="center" width="2" position="0 0.4 0"></a-text>
                    <a-entity id="portfolio-item0">
                        <a-image id="paintandquest-preview-button" class="clickable" src="#paintandquest-preview"
                            alpha-test="0.5" position="0 0 0" height="0.552" width="1"></a-image>
                    </a-entity>
                    <a-entity id="portfolio-item1" visible=false>
                        <a-image class="clickable" src="#05_NonEuclidianGeometry" alpha-test="0.5" position="0 0 0" height="0.552" width="1"></a-image>
                    </a-entity>
                    <a-entity id="portfolio-item2" visible=false>
                        <a-image class="clickable" src="#04_CrowdPrediction" alpha-test="0.5" position="0 0 0" height="0.552" width="1"></a-image>
                    </a-entity>
                    <a-entity id="portfolio-item3" visible=false>
                        <a-image class="clickable" src="#03_SmartMonitoring" alpha-test="0.5" position="0 0 0" height="0.552" width="1"></a-image>
                    </a-entity>
                    <a-entity id="portfolio-item4" visible=false>
                        <a-image class="clickable" src="#02_CityScope" alpha-test="0.5" position="0 0 0" height="0.552" width="1"></a-image>
                    </a-entity>
                    <a-image visible=false id="portfolio-left-button" class="clickable" src="#icon-left"
                        position="-0.6 0 0" height="0.15" width="0.15"></a-image>
                    <a-image visible=false id="portfolio-right-button" class="clickable" src="#icon-right"
                        position="0.6 0 0" height="0.15" width="0.15"></a-image>
                </a-entity>

                <a-image visible=false id="profile-button" class="clickable" src="#icon-profile" position="-0.50 -0.5 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
                <a-image visible=false id="web-button" class="clickable" src="#icon-web" position="-0.25 -0.5 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
                <a-image visible=false id="email-button" class="clickable" src="#icon-email" position="0 -0.5 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
                <a-image visible=false id="location-button" class="clickable" src="#icon-linkedin" position="0.25 -0.5 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
                <a-image visible=false id="github-button" class="clickable" src="#icon-github" position="0.50 -0.5 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
                <a-entity gltf-model="#avatarModel" id="avatar" rotation="0 0 0" position="0 -0.25 0"
                    scale="0.1 0.1 0.1" src="#avatarModel" animation-mixer></a-entity>
                <a-text id="text" class="clickable" value="_" color="black" align="center" width="2" position="0 -0.7 0"
                    side="double" geometry="primitive:plane; height: 0.1; width: 2;" material="opacity: 0.5"></a-text>
                <a-image visible=false id="click-button" class="clickable" src="#icon-click" position="0.52 -0.75 0" height="0.2" width="0.12"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-image>
            </a-entity>
        </a-scene>
    </div>

    <div class="ar-footer">
        <div>Scan Celine's card to reveal the AR animation &nbsp;·&nbsp; Supported on iPhone 15+ and most modern Android phones</div>
        <div class="ar-footer-hint">No physical card? Download and print it. <a href="./images/business-card.png" download="CelineHsieh-BusinessCard.png">Here</a></div>
    </div>
</body>
</html>
